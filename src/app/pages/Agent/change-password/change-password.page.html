<ion-header class="ion-no-border">
  <ion-toolbar style="--background: #ffffff; --min-height: 52px;">
    <ion-title>
      <span class="text-[13px] font-medium text-zinc-700">Changer le mot de passe</span>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()" style="--color: #a1a1aa;">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content style="--background: #ffffff;">
  <div class="px-5 pt-2 pb-8">

    <div class="flex justify-center mb-6 mt-2">
      <div class="w-12 h-12 bg-zinc-100 rounded-2xl flex items-center justify-center">
        <ion-icon name="key-outline" class="text-zinc-500 text-xl"></ion-icon>
      </div>
    </div>

    <div class="space-y-4 mb-8">

      <div class="flex flex-col gap-1.5">
        <label class="text-[10px] font-semibold tracking-widest uppercase text-zinc-400">Mot de passe actuel</label>
        <input type="password" [(ngModel)]="data.oldPassword"
               placeholder="••••••••"
               class="w-full bg-zinc-50 border border-zinc-200 rounded-xl px-4 py-3 text-[13px] text-zinc-800 outline-none focus:border-zinc-400 transition-colors placeholder-zinc-300">
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-[10px] font-semibold tracking-widest uppercase text-zinc-400">Nouveau mot de passe</label>
        <input type="password" [(ngModel)]="data.newPassword"
               placeholder="••••••••"
               class="w-full bg-zinc-50 border border-zinc-200 rounded-xl px-4 py-3 text-[13px] text-zinc-800 outline-none focus:border-zinc-400 transition-colors placeholder-zinc-300">
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-[10px] font-semibold tracking-widest uppercase text-zinc-400">Confirmer le nouveau mot de passe</label>
        <input type="password" [(ngModel)]="data.confirmPassword"
               placeholder="••••••••"
               class="w-full bg-zinc-50 border border-zinc-200 rounded-xl px-4 py-3 text-[13px] text-zinc-800 outline-none focus:border-zinc-400 transition-colors placeholder-zinc-300">
      </div>

    </div>

    <button (click)="onSubmit()"
            [disabled]="!data.oldPassword || !data.newPassword || !data.confirmPassword"
            class="w-full py-3.5 bg-zinc-900 text-white rounded-xl text-[13px] font-medium hover:bg-zinc-700 disabled:opacity-40 disabled:cursor-not-allowed transition-all active:scale-[0.98] mb-2">
      Enregistrer le nouveau mot de passe
    </button>

    <button (click)="dismiss()"
            class="w-full py-3 text-[13px] font-medium text-zinc-400 hover:text-zinc-600 transition-colors">
      Annuler
    </button>

  </div>
</ion-content>

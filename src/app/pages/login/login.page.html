<div class="h-screen w-screen overflow-y-auto bg-slate-50 p-4">
  <div class="flex flex-col justify-center min-h-full items-center">
    
    <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-lg border border-slate-100">
      
      <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-900 text-white rounded-full mb-4 shadow-md">
          <i class="bi bi-envelope-paper text-3xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800">Connexion</h1>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="space-y-6">
        
        <div class="space-y-2">
          <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider ml-1">Adresse Email</label>
          <div class="relative flex items-center">
            <i class="bi bi-at absolute left-3 text-slate-400 text-xl z-10"></i>
            <input 
              formControlName="email"
              type="email"
              placeholder="nom@post.tn"
              class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 transition-all outline-none bg-slate-50 text-slate-800 appearance-none">
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider ml-1">Mot de passe</label>
          <div class="relative flex items-center">
            <i class="bi bi-lock-fill absolute left-3 text-slate-400 text-lg z-10"></i>
            <input 
              formControlName="password"
              type="password"
              placeholder="••••••••"
              class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 transition-all outline-none bg-slate-50 text-slate-800 appearance-none">
          </div>
        </div>

        <button 
          type="submit" 
          [disabled]="loginForm.invalid"
          class="w-full py-4 bg-blue-900 hover:bg-blue-800 disabled:bg-slate-300 text-white font-bold rounded-xl transition-all shadow-lg active:scale-95 flex items-center justify-center gap-2 cursor-pointer">
          <span>Se connecter</span>
          <i class="bi bi-arrow-right"></i>
        </button>

      </form>

      <div class="mt-6 text-center">
        <p class="text-sm text-slate-500">
          Vous n'avez pas de compte ? 
          <a (click)="goToRegister()" class="text-blue-900 font-bold cursor-pointer hover:underline ml-1">S'inscrire</a>
        </p>
      </div>

    </div>
  </div>
</div>

<!-- add-agent.page.html -->
<div class="min-h-full p-10">

  <!-- Page header -->
  <div class="mb-8 border-b border-zinc-100 pb-8">
    <a (click)="onCancel()"
       class="inline-flex items-center gap-1.5 text-[12px] text-zinc-400 hover:text-zinc-700 transition-colors mb-5 cursor-pointer no-underline">
      <ion-icon name="arrow-back-outline" class="text-sm"></ion-icon>
      Back to Agents
    </a>
    <p class="text-[10px] font-semibold tracking-widest uppercase text-zinc-400 mb-1">Staff</p>
    <h1 class="text-2xl font-semibold text-zinc-900 tracking-tight">Create Agent Account</h1>
  </div>

  <!-- Form — two column layout -->
  <form [formGroup]="agentForm" (ngSubmit)="onSubmit()" class="max-w-2xl">

    <div class="grid grid-cols-2 gap-5 mb-5">
      <div class="flex flex-col gap-1.5">
        <label class="text-[10px] font-semibold tracking-widest uppercase text-zinc-400">First Name</label>
        <input type="text" formControlName="firstName" placeholder="John"
               class="bg-white border border-zinc-200 rounded-lg px-3.5 py-2.5 text-[13px] text-zinc-800 outline-none focus:border-zinc-500 transition-colors placeholder-zinc-300">
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-[10px] font-semibold tracking-widest uppercase text-zinc-400">Last Name</label>
        <input type="text" formControlName="lastName" placeholder="Doe"
               class="bg-white border border-zinc-200 rounded-lg px-3.5 py-2.5 text-[13px] text-zinc-800 outline-none focus:border-zinc-500 transition-colors placeholder-zinc-300">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-5 mb-5">
      <div class="flex flex-col gap-1.5">
        <label class="text-[10px] font-semibold tracking-widest uppercase text-zinc-400">Work Email</label>
        <input type="email" formControlName="email" placeholder="john.doe@agency.com"
               class="bg-white border border-zinc-200 rounded-lg px-3.5 py-2.5 text-[13px] text-zinc-800 outline-none focus:border-zinc-500 transition-colors placeholder-zinc-300">
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-[10px] font-semibold tracking-widest uppercase text-zinc-400">Phone Number</label>
        <input type="text" formControlName="phoneNumber" placeholder="+216 ..."
               class="bg-white border border-zinc-200 rounded-lg px-3.5 py-2.5 text-[13px] text-zinc-800 outline-none focus:border-zinc-500 transition-colors placeholder-zinc-300">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-5 mb-5">
      <div class="flex flex-col gap-1.5">
        <label class="text-[10px] font-semibold tracking-widest uppercase text-zinc-400">Initial Password</label>
        <input type="password" formControlName="password" placeholder="••••••••"
               class="bg-white border border-zinc-200 rounded-lg px-3.5 py-2.5 text-[13px] text-zinc-800 outline-none focus:border-zinc-500 transition-colors placeholder-zinc-300">
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-[10px] font-semibold tracking-widest uppercase text-zinc-400">Assigned Agency</label>
        <ion-select formControlName="agencyId"
                    placeholder="Select agency"
                    interface="popover"
                    class="agency-select bg-white border border-zinc-200 rounded-lg px-3.5 text-[13px] text-zinc-800">
          @for (agency of agencies; track agency.id) {
            <ion-select-option [value]="agency.id">{{ agency.name }}</ion-select-option>
          }
        </ion-select>
      </div>
    </div>

    <!-- Submit -->
    <div class="pt-6 border-t border-zinc-100 mt-8 flex items-center gap-3">
      <button type="submit"
              [disabled]="agentForm.invalid"
              class="px-6 py-2.5 bg-zinc-900 text-white text-[13px] font-medium rounded-lg hover:bg-zinc-700 disabled:opacity-40 disabled:cursor-not-allowed transition-all">
        Register Agent
      </button>
      <a (click)="onCancel()"
         class="px-5 py-2.5 text-[13px] font-medium text-zinc-400 hover:text-zinc-700 transition-colors cursor-pointer no-underline">
        Cancel
      </a>
    </div>

  </form>

</div>

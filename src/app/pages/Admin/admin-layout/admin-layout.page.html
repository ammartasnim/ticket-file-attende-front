<ion-split-pane contentId="main-content" [when]="true">
  <ion-menu contentId="main-content" type="push">
    <ion-content style="--background: #ffffff;">

      <div class="px-6 py-7 border-b border-zinc-100">
        <h1 class="text-base font-semibold text-zinc-900 tracking-tight">Panneau d'Administration</h1>
      </div>

      <nav class="flex flex-col gap-1 px-3 pt-5">

        <a routerLink="dashboard" 
           routerLinkActive="bg-zinc-50 text-zinc-900 shadow-sm"
           class="flex items-center gap-3 px-4 py-2.5 text-[13px] font-medium text-zinc-500 rounded-lg hover:bg-zinc-50 transition-all no-underline">
          <i class="bi bi-pie-chart text-lg"></i>
          <span>Tableau de Bord</span>
        </a>

        <a routerLink="agencies" 
           routerLinkActive="bg-zinc-50 text-zinc-900 shadow-sm"
           class="flex items-center gap-3 px-4 py-2.5 text-[13px] font-medium text-zinc-500 rounded-lg hover:bg-zinc-50 transition-all no-underline">
          <i class="bi bi-building text-lg"></i>
          <span>Agences</span>
        </a>

        <a routerLink="agents" 
           routerLinkActive="bg-zinc-50 text-zinc-900 shadow-sm"
           class="flex items-center gap-3 px-4 py-2.5 text-[13px] font-medium text-zinc-500 rounded-lg hover:bg-zinc-50 transition-all no-underline">
          <i class="bi bi-people text-lg"></i>
          <span>Agents</span>
        </a>

        <a routerLink="services" 
           routerLinkActive="bg-zinc-50 text-zinc-900 shadow-sm"
           class="flex items-center gap-3 px-4 py-2.5 text-[13px] font-medium text-zinc-500 rounded-lg hover:bg-zinc-50 transition-all no-underline">
          <i class="bi bi-list-ul text-lg"></i>
          <span>Services</span>
        </a>

      </nav>

      <div class="absolute bottom-0 left-0 right-0 border-t border-zinc-100 px-3 py-3 bg-white">
        <button (click)="logout()" 
                class="w-full flex items-center gap-3 px-4 py-2.5 text-[13px] font-medium text-red-500 rounded-lg hover:bg-red-50 transition-all">
          <i class="bi bi-box-arrow-right text-lg"></i>
          <span>Déconnexion</span>
        </button>
      </div>

    </ion-content>
  </ion-menu>

  <div class="ion-page" id="main-content">
    <ion-content style="--background: #fafaf9;">
      <ion-router-outlet></ion-router-outlet>
    </ion-content>
  </div>
</ion-split-pane>

<ion-split-pane contentId="main-content" [when]="true">
  <ion-menu contentId="main-content" type="push">
    <ion-content style="--background: #ffffff;">

      <div class="px-6 py-7 border-b border-zinc-100">
        <h1 class="text-base font-semibold text-zinc-900 tracking-tight">Panneau d'Administration</h1>
      </div>

      <ion-list lines="none" class="bg-transparent px-3 pt-5">

        <ion-item button routerLink="dashboard" routerLinkActive="active-nav" class="nav-item rounded-lg mb-0.5">
          <ion-icon name="pie-chart-outline" slot="start"></ion-icon>
          <ion-label>Tableau de Bord</ion-label>
        </ion-item>

        <ion-item button routerLink="agencies" routerLinkActive="active-nav" class="nav-item rounded-lg mb-0.5">
          <ion-icon name="business-outline" slot="start"></ion-icon>
          <ion-label>Agences</ion-label>
        </ion-item>

        <ion-item button routerLink="agents" routerLinkActive="active-nav" class="nav-item rounded-lg mb-0.5">
          <ion-icon name="people-outline" slot="start"></ion-icon>
          <ion-label>Agents</ion-label>
        </ion-item>

        <ion-item button routerLink="services" routerLinkActive="active-nav" class="nav-item rounded-lg mb-0.5">
          <ion-icon name="list-outline" slot="start"></ion-icon>
          <ion-label>Services</ion-label>
        </ion-item>

      </ion-list>

      <div class="absolute bottom-0 left-0 right-0 border-t border-zinc-100 px-3 py-3">
        <ion-item button (click)="logout()" lines="none" class="nav-item logout-item rounded-lg">
          <ion-icon name="log-out-outline" slot="start"></ion-icon>
          <ion-label>Déconnexion</ion-label>
        </ion-item>
      </div>

    </ion-content>
  </ion-menu>

  <div class="ion-page" id="main-content">
    <ion-content style="--background: #fafaf9;">
      <ion-router-outlet></ion-router-outlet>
    </ion-content>
  </div>
</ion-split-pane>
